<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NBA Arcade · Pack Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Teko:ital,wght@0,700;1,700&display=swap" rel="stylesheet"/>
<style>
/* PACK LAB · three pack designs, each with its own way of opening, and one shared card reveal.
   Separate from the NEXT build. Real portraits; the pulls are random each time. */
:root{--px:'Press Start 2P',ui-monospace,monospace;--tk:'Teko','Arial Narrow',sans-serif;--bg:#060a16;--card:#0f1528;--edge:#1f2a4a;--t1:#eef1fb;--t2:#9fb0d6;--t3:#5d6c95;--gold:#ffd93d;--green:#39ff6a;--pink:#ff5fbf;--blue:#4adfff;--red:#ff3b5c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(90% 50% at 50% 0%,#18224e,#060a16 70%) fixed;color:var(--t1);font-family:var(--px);overflow-x:hidden}
main{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
h1{margin:0;font-size:12px;font-weight:normal;color:var(--gold)}
header p{margin:8px 0 0;font-size:6.5px;line-height:2;color:var(--t2);max-width:620px}
header a,.snd{font:inherit;font-size:6px;color:var(--t3);text-decoration:none;border:2px solid var(--edge);padding:7px 9px;border-radius:6px;background:none;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:6.5px;padding:9px 10px;border-radius:7px;border:2px solid var(--edge);background:#12182e;color:var(--t2);cursor:pointer}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#1a1200}
.why{font-size:6px;line-height:2.1;color:var(--t2);max-width:720px}.why b{font-weight:normal;color:var(--gold)}
.stage{position:relative;height:min(560px,72vh);border:2px solid var(--edge);border-radius:14px;overflow:hidden;background:radial-gradient(60% 50% at 50% 55%,#1b2a5c,#070b18 75%);touch-action:none;user-select:none;-webkit-user-select:none}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
.hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:7px;color:#fff;text-shadow:0 2px 0 #000;z-index:30;animation:blink 1.2s steps(2) infinite;pointer-events:none}
@keyframes blink{50%{opacity:.35}}
.again{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;font:inherit;font-size:7px;padding:11px 16px;border-radius:9px;border:3px solid #000;background:var(--gold);color:#1a1200;box-shadow:0 4px 0 #8a5a00;cursor:pointer}
.flash{position:absolute;inset:0;z-index:25;pointer-events:none;background:#fff;opacity:0}
.flash.go{animation:fl .5s ease-out}@keyframes fl{0%{opacity:.95}100%{opacity:0}}

/* ── CARD (lab version of the small card) ── */
.cd{position:absolute;width:150px;aspect-ratio:5/7;perspective:900px;z-index:10;transition:transform .55s cubic-bezier(.2,.9,.3,1.2),left .55s,top .55s}
.cd .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.cd.up .in{transform:rotateY(180deg)}
.cd .bk,.cd .fc{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #000;overflow:hidden}
.cd .bk{background:radial-gradient(circle at 50% 45%,#1d3a7a,#060c22 75%);box-shadow:inset 0 0 0 4px #e8ecf5,inset 0 0 0 7px #000}
.cd .bk::before{content:'';position:absolute;inset:14%;border:2px solid rgba(255,255,255,.25);border-radius:50%}
.cd .bk::after{content:'NBA\AARCADE';white-space:pre;position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.6;background:linear-gradient(180deg,#6fb4ff,#fff 52%,#ff4a5a 56%,#8e0a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000)}
.cd .fc{transform:rotateY(180deg);display:flex;flex-direction:column;padding:6px;background:var(--fr)}
.cd .fc .nm{background:#000;color:#fff;font-size:7px;text-align:center;padding:5px 2px;border-radius:4px 4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .fc .ph{position:relative;flex:1;overflow:hidden;background:var(--tc)}
.cd .fc .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.cd .fc .ft{background:#000;color:var(--rc);font-size:5.5px;padding:5px 4px;display:flex;justify-content:space-between;border-radius:0 0 4px 4px}
.cd.r-base{--fr:linear-gradient(160deg,#eef1f6,#9aa4b8);--rc:#c9d0de}
.cd.r-gold{--fr:linear-gradient(125deg,#7a5200,#d9a520 22%,#fff2b0 34%,#c8901a 48%,#f5d061 66%,#b07a10 90%);--rc:#ffd93d}
.cd.r-holo{--fr:linear-gradient(90deg,#ff5fbf,#ffd93d,#39ff6a,#4adfff,#b36bff,#ff5fbf);--rc:#b9f}
.cd.r-star{--fr:conic-gradient(from 0deg,#ff5fbf,#ffd93d,#39ff6a,#4adfff,#b36bff,#ff5fbf);--rc:#fff}
.cd.r-holo .fc,.cd.r-star .fc{background-size:300% 100%;animation:sheen 3s linear infinite}@keyframes sheen{to{background-position:300% 0}}
.cd.r-star .fc .ph::after{content:'★';position:absolute;right:5px;top:3px;font-size:16px;color:#ffd93d;text-shadow:0 0 6px #000}
.cd .glare{position:absolute;inset:0;border-radius:10px;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 62%);background-size:250% 250%;animation:gl 2.6s ease-in-out infinite;transform:rotateY(180deg);backface-visibility:hidden}
@keyframes gl{0%{background-position:150% 0}100%{background-position:-60% 0}}
/* rare tease: before the flip, the back glows the rarity colour and shakes */
.cd.tease .bk{box-shadow:inset 0 0 0 4px var(--tz),inset 0 0 0 7px #000,0 0 26px var(--tz),0 0 60px var(--tz)}
.cd.tease.shake .in{animation:tz .12s linear infinite}@keyframes tz{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
.cd.r-gold{--tz:#ffd93d}.cd.r-holo{--tz:#b36bff}.cd.r-star{--tz:#ff5fbf}
.rname{position:absolute;left:0;right:0;top:18px;text-align:center;z-index:30;font-size:9px;color:#fff;text-shadow:0 2px 0 #000;pointer-events:none}
.rname small{display:block;margin-top:7px;font-size:6px;color:var(--rc,#c9d0de)}
.burst{position:absolute;left:50%;top:50%;width:10px;height:10px;z-index:9;pointer-events:none}
.burst i{position:absolute;width:6px;height:6px;background:var(--c,#ffd93d);box-shadow:0 0 8px var(--c,#ffd93d);animation:bp .9s ease-out forwards}
@keyframes bp{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}

/* ── A · FOIL PACK ── */
.foil{position:absolute;left:50%;top:50%;width:190px;height:290px;transform:translate(-50%,-50%) rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg));transform-style:preserve-3d;z-index:12;filter:drop-shadow(0 18px 20px rgba(0,0,0,.6))}
.foil .body,.foil .top{position:absolute;left:0;right:0;background:conic-gradient(from calc(var(--a,0)*1deg) at 50% 60%,#1d4fd8,#6fb4ff,#fff,#ff4a5a,#8e0a1a,#1d4fd8);overflow:hidden}
.foil .top{top:0;height:34px;clip-path:polygon(0 18%,5% 0,10% 18%,15% 0,20% 18%,25% 0,30% 18%,35% 0,40% 18%,45% 0,50% 18%,55% 0,60% 18%,65% 0,70% 18%,75% 0,80% 18%,85% 0,90% 18%,95% 0,100% 18%,100% 100%,0 100%);transition:transform .7s cubic-bezier(.4,1.6,.5,1),opacity .7s}
.foil .body{top:34px;bottom:0;clip-path:polygon(0 0,100% 0,100% 94%,95% 100%,90% 94%,85% 100%,80% 94%,75% 100%,70% 94%,65% 100%,60% 94%,55% 100%,50% 94%,45% 100%,40% 94%,35% 100%,30% 94%,25% 100%,20% 94%,15% 100%,10% 94%,5% 100%,0 94%)}
.foil .body::before,.foil .top::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 6px,rgba(255,255,255,.14) 6px 7px),linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) calc(var(--g,50)*1%),transparent calc(var(--g,50)*1% + 18%));mix-blend-mode:overlay}
.foil .lbl{position:absolute;inset:14px 14px 22px;border:3px solid #000;border-radius:8px;background:radial-gradient(circle at 50% 30%,#1a2f6e,#060c22 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.foil .lbl .lg{font-size:15px;line-height:1.5;background:linear-gradient(180deg,#1d4fd8,#6fb4ff 30%,#fff 52%,#ff9aa5 56%,#e01a2e 80%,#8e0a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000)}
.foil .lbl small{font-size:5.5px;color:#c9d0de;line-height:1.9}
.foil .lbl .five{font-family:var(--tk);font-style:italic;font-size:30px;color:#ffd93d;text-shadow:0 3px 0 #7a4b00;line-height:.8}
.foil .tearline{position:absolute;left:0;top:34px;height:3px;width:calc(var(--t,0)*100%);background:#fff;box-shadow:0 0 8px #fff,0 0 16px var(--gold);z-index:3}
.foil .notch{position:absolute;left:-4px;top:28px;width:16px;height:14px;z-index:4;border-left:3px dashed #fff;animation:blink 1s steps(2) infinite}
.foil.torn .top{transform:translate(60px,-160px) rotate(28deg);opacity:0}
.foil.open{transition:transform .6s,opacity .6s;transform:translate(-50%,40%) scale(.9);opacity:0}

/* ── B · GACHA CAPSULE ── */
.gacha{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:200px;height:330px;z-index:12}
.gacha .dome{position:absolute;left:10px;right:10px;top:0;height:170px;border-radius:90px 90px 14px 14px;border:4px solid #000;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),rgba(255,255,255,.06) 40%),rgba(120,170,255,.12);overflow:hidden}
.gacha .dome i{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid #000;background:linear-gradient(180deg,var(--c) 50%,#f2f2f2 50%)}
.gacha .base{position:absolute;left:0;right:0;top:162px;bottom:0;border:4px solid #000;border-radius:16px;background:linear-gradient(180deg,#e01a2e,#8e0a1a);box-shadow:inset 0 4px 0 rgba(255,255,255,.25)}
.gacha .plate{position:absolute;left:18px;right:18px;top:14px;text-align:center;font-size:6px;color:#fff;padding:6px;border:2px solid #000;background:#000;border-radius:5px}
.gacha .plate b{display:block;font-weight:normal;color:var(--gold);margin-top:4px}
.gacha .knob{position:absolute;left:50%;top:58px;width:64px;height:64px;margin-left:-32px;border-radius:50%;border:4px solid #000;background:radial-gradient(circle at 35% 30%,#fff,#c9d0de 60%,#8e98ab);cursor:pointer;transition:transform .45s cubic-bezier(.4,1.6,.5,1)}
.gacha .knob::after{content:'';position:absolute;left:50%;top:6px;bottom:6px;width:12px;margin-left:-6px;border-radius:6px;background:#3a4258;border:2px solid #000}
.gacha .chute{position:absolute;left:50%;bottom:14px;width:70px;height:44px;margin-left:-35px;border:4px solid #000;border-radius:8px;background:#1a0004}
.gacha .turns{position:absolute;right:12px;top:72px;display:flex;flex-direction:column;gap:5px}.gacha .turns i{width:10px;height:10px;border:2px solid #000;border-radius:50%;background:#3a0010}.gacha .turns i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.cap{position:absolute;left:50%;top:76%;width:84px;height:84px;margin-left:-42px;z-index:14;cursor:pointer;transition:top .7s cubic-bezier(.3,1.5,.5,1),transform .3s}
.cap .h1,.cap .h2{position:absolute;left:0;right:0;height:50%;border:4px solid #000;transition:transform .6s cubic-bezier(.3,1.2,.4,1),opacity .6s}
.cap .h1{top:0;border-radius:42px 42px 0 0;border-bottom-width:2px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),transparent 40%),var(--cc)}
.cap .h2{bottom:0;border-radius:0 0 42px 42px;border-top-width:2px;background:#f2f2f2}
.cap .ck{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(60deg,transparent 48%,#000 48% 51%,transparent 51%) 0 0/100% 100%;opacity:0}
.cap.k1 .ck{opacity:.7}.cap.k2 .ck{opacity:1;background:linear-gradient(60deg,transparent 48%,#000 48% 51%,transparent 51%),linear-gradient(-50deg,transparent 47%,#000 47% 50%,transparent 50%)}
.cap.k1,.cap.k2{animation:tz .12s linear 4}
.cap.pop .h1{transform:translate(-40px,-120px) rotate(-50deg);opacity:0}.cap.pop .h2{transform:translate(40px,110px) rotate(40deg);opacity:0}

/* ── C · CARTRIDGE ── */
.cons{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:230px;height:250px;z-index:12}
.cons .bd{position:absolute;inset:40px 0 0;border:4px solid #000;border-radius:14px 14px 40px 14px;background:linear-gradient(160deg,#e9e6dc,#c6c1b3)}
.cons .slot{position:absolute;left:30px;right:30px;top:40px;height:16px;background:#26262c;border:3px solid #000;border-top:0;border-radius:0 0 6px 6px}
.cons .scr{position:absolute;left:28px;right:28px;top:76px;height:110px;border:6px solid #6e6b82;border-radius:6px;background:#a4ba30;overflow:hidden;color:#14381a;font-size:6px;line-height:1.9;padding:8px}
.cons .scr::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,56,26,.12) 1px,transparent 1px) 0 0/3px 3px,linear-gradient(rgba(20,56,26,.12) 1px,transparent 1px) 0 0/3px 3px}
.cons .scr.off{background:#5a6620}.cons .scr .bar{height:8px;border:2px solid #14381a;margin-top:6px}.cons .scr .bar i{display:block;height:100%;width:0;background:#14381a;transition:width 1.6s steps(12)}
.cons .led{position:absolute;left:12px;top:120px;width:7px;height:7px;border-radius:50%;background:#4a1010}.cons .led.on{background:#ff2b2b;box-shadow:0 0 6px #ff2b2b}
.cons .pad{position:absolute;left:24px;bottom:18px;width:42px;height:42px;background:linear-gradient(#26262c,#26262c) center/14px 100% no-repeat,linear-gradient(#26262c,#26262c) center/100% 14px no-repeat}
.cons .ab{position:absolute;right:26px;bottom:24px;display:flex;gap:10px;transform:rotate(-25deg)}.cons .ab i{width:20px;height:20px;border-radius:50%;background:#9a2257;border:2px solid #000}
.cart{position:absolute;left:50%;top:6%;width:150px;height:120px;margin-left:-75px;z-index:13;cursor:pointer;transition:top .6s cubic-bezier(.4,1.3,.5,1)}
.cart .sh{position:absolute;inset:0;border:4px solid #000;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#3a3d4a,#24262f)}
.cart .sh::before{content:'';position:absolute;left:10px;right:10px;top:6px;height:8px;background:repeating-linear-gradient(90deg,#4a4d5a 0 6px,#24262f 6px 10px)}
.cart .lb{position:absolute;left:14px;right:14px;top:22px;bottom:16px;border:3px solid #000;border-radius:4px;background:linear-gradient(135deg,#1d4fd8,#e01a2e);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center}
.cart .lb b{font-weight:normal;font-size:8px;color:#fff;text-shadow:2px 2px 0 #000}.cart .lb small{font-size:5px;color:#ffd93d}
.cart.in{top:-2%}
.cart.in.seat{top:-4%}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
/* ── ★ SIGNATURE: the full flow (shop → pick from the ring → swipe to cut → swipe through → results → into the binder) ── */
.stage.pro{height:min(680px,80vh);background:radial-gradient(80% 50% at 50% 38%,#2c4596,#0b1236 62%,#050816)}
.stage.pro::after{display:none}
.stage.pro::before{content:'';position:absolute;left:-20%;right:-20%;bottom:-8%;height:34%;background:radial-gradient(50% 60% at 50% 30%,rgba(140,180,255,.25),transparent 70%);pointer-events:none}
.pk{position:absolute;aspect-ratio:640/1057;container-type:inline-size;--lx:32;--ly:28;filter:drop-shadow(0 20px 22px rgba(0,0,0,.6)) drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.pk .pt,.pk .pb{position:absolute;left:0;right:0;overflow:hidden;background:url(pack.webp) 0 0/100cqw 165.16cqw no-repeat}
.pk .pt{top:0;height:6.5%;z-index:3;transition:transform .75s cubic-bezier(.3,.7,.4,1),opacity .75s}
.pk .pb{top:6.5%;bottom:0;background-position:0 -10.74cqw;-webkit-mask:url(pack.webp) 0 -10.74cqw/100cqw 165.16cqw no-repeat;mask:url(pack.webp) 0 -10.74cqw/100cqw 165.16cqw no-repeat}
/* specular: a warm light that follows the tilt and only lands on the foil's real wrinkles and seal ridges */
.pk .pt::after,.pk .pb::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(40cqw 55cqw at calc(var(--lx)*1cqw) calc(var(--ly)*1.6516cqw),rgba(255,255,255,.95),rgba(255,255,255,.3) 45%,transparent 75%) 0 0/100cqw 165.16cqw no-repeat;
  -webkit-mask:url(spec.webp) 0 0/100cqw 165.16cqw no-repeat;mask:url(spec.webp) 0 0/100cqw 165.16cqw no-repeat}
.pk .pb::after{background-position:0 -10.74cqw;-webkit-mask-position:0 -10.74cqw;mask-position:0 -10.74cqw}
.pk .gl{position:absolute;inset:0;pointer-events:none;z-index:5;mix-blend-mode:screen;transition:opacity .4s;
  background:linear-gradient(calc(105deg + var(--lx)*.3deg),transparent 30%,rgba(255,255,255,.05) 44%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.04) 56%,transparent 70%);
  -webkit-mask:url(pack.webp) 0 0/100% 100%;mask:url(pack.webp) 0 0/100% 100%}
.pk.torn .gl,.big.torn .gl{opacity:0}
/* artwork printed on the foil */
.pk .wm{position:absolute;left:7%;top:12.2%;font-size:5cqw;white-space:nowrap;letter-spacing:.02em;z-index:2;
  background:linear-gradient(100deg,#fff 0 34%,#bdf3ff 40%,#ffc9f1 45%,#fff3b0 50%,#fff 56% 100%) calc(var(--lx)*-2.2%) 0/320% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .35cqw 0 rgba(0,25,110,.55))}
.pk .sub{position:absolute;left:7.2%;top:16.7%;font-size:2.9cqw;letter-spacing:.22em;color:#fff;text-shadow:0 .3cqw 0 rgba(0,0,0,.5);z-index:2;white-space:nowrap}
.pk .sub b{font-weight:normal;color:#ffd0d6}
.pk .rule{position:absolute;left:7.2%;top:19%;width:47%;height:.5cqw;z-index:2;background:linear-gradient(90deg,#fff 0 33%,#ff4458 33% 66%,transparent 66%);opacity:.85}
/* a basketball embossed big into the foil, running off the corner */
.pk .ball{position:absolute;right:-30cqw;bottom:-16cqw;width:104cqw;aspect-ratio:1;z-index:1;opacity:.5;mix-blend-mode:soft-light}
.pk .ball svg{width:100%;height:100%;display:block}
/* holo sticker */
.pk .stk{position:absolute;right:8%;bottom:9%;width:25cqw;aspect-ratio:1;border-radius:50%;z-index:3;transform:rotate(-14deg);display:grid;place-items:center;text-align:center;
  background:conic-gradient(from calc(var(--lx)*4deg),#ffd1f4,#bdf3ff,#d4ffc9,#fff3b0,#ffc9e0,#c9d4ff,#ffd1f4);box-shadow:0 .8cqw 1.2cqw rgba(0,10,60,.45),inset 0 0 0 .7cqw rgba(255,255,255,.75),inset 0 0 0 1.1cqw rgba(0,40,140,.18)}
.pk .stk::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(calc(120deg + var(--lx)*1deg),transparent 35%,rgba(255,255,255,.8) 50%,transparent 62%)}
.pk .stk b{font-weight:normal;font-size:7.4cqw;line-height:1;color:#0b2f8f;text-shadow:0 .3cqw 0 rgba(255,255,255,.7)}
.pk .stk small{display:block;font-size:1.9cqw;letter-spacing:.15em;color:#0b2f8f;margin-top:1.2cqw}
.pk .stk span{position:relative;z-index:1}
.shopk{transform:perspective(900px) rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg))}
.shd{position:absolute;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);filter:blur(4px);pointer-events:none}
.prow{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:6px;padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);z-index:5}
.prow .mi{width:38px;aspect-ratio:5/7;border-radius:4px;border:2px solid #000;padding:2px;background:var(--fr);overflow:hidden}
.prow .mi img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;background:var(--tc);display:block;border-radius:2px}
.prow small{align-self:center;font-size:5px;line-height:1.8;color:var(--t2);margin-left:4px}

  background:radial-gradient(circle,rgba(255,255,255,.14) 0 .55cqw,transparent .65cqw) 0 0/3.2cqw 3.2cqw,repeating-conic-gradient(from 0deg at 50% 70%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 14deg),

<body>
<main>
  <header>
    <div><h1>📦 PACK LAB</h1><p>★ SIGNATURE is the full opening flow, from shop to binder. A, B and C are pack looks with their own opening moves. Five real players per pack, at least one a hit (Gold, Holo or All-Star). Hits glow and shake before you flip them. This lab is separate from the NEXT build.</p></div>
    <div style="display:flex;gap:6px"><button class="snd" id="snd">🔊 SOUND ON</button><a href="../">← BACK TO NEXT</a></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="why" id="why"></div>
  <div class="stage" id="st"></div>
</main>
<script>
(async()=>{
/* ── data: real players from the NEXT sample list ── */
let RAW=[]; try{ const t=await fetch('../data.js').then(r=>r.text()); RAW=JSON.parse(t.match(/const RAW = (\[[\s\S]*?\]);/)[1]); }catch(e){}
if(!RAW.length) RAW=[["Nikola Jokic","DEN","C",33.9],["Victor Wembanyama","SAS","F",36.2],["Jayson Tatum","BOS","F",26.1],["Stephen Curry","GSW","G",26.6],["Luka Doncic","LAL","G",37.6]];
const TC={ATL:'#C8102E',BOS:'#007A33',BKN:'#222',CHA:'#1D1160',CHI:'#CE1141',CLE:'#860038',DAL:'#00538C',DEN:'#0E2240',DET:'#C8102E',GSW:'#1D428A',HOU:'#CE1141',IND:'#002D62',LAC:'#1D428A',LAL:'#552583',MEM:'#5D76A9',MIA:'#98002E',MIL:'#00471B',MIN:'#0C2340',NOP:'#0C2340',NYK:'#006BB6',OKC:'#007AC1',ORL:'#0077C0',PHI:'#006BB6',PHX:'#1D1160',POR:'#E03A3E',SAC:'#5A2D81',SAS:'#8A96A0',TOR:'#CE1141',UTA:'#002B5C',WAS:'#002B5C'};
const PORTRAITS='https://ipsngddnavymcmfbbcxu.supabase.co/storage/v1/object/public/player-portraits';
const pimg=(t,n)=>`${PORTRAITS}/${t}/${encodeURIComponent(n)}.jpeg`;
const POOL=RAW.filter(r=>r[0]).sort((a,b)=>b[3]-a[3]).slice(0,160);
const RAR={base:'BASE',gold:'GOLD',holo:'HOLO',star:'ALL-STAR'};
function pull(){ const pick=new Set(); while(pick.size<5) pick.add(POOL[Math.floor(Math.random()*POOL.length)]);
  const L=[...pick].map(r=>({n:r[0],t:r[1],r:'base'}));
  const x=Math.random(), hit=x<.08?'star':x<.33?'holo':'gold'; L[4].r=hit; if(Math.random()<.25) L[1+Math.floor(Math.random()*3)].r='gold';
  return L; }

/* ── sound (same chip kit as the Sound Lab picks) ── */
let AC=null, SND=true;
function tone(f,{t=0,d=.08,type='square',v=.05,f2=null}={}){ if(!SND) return; try{ AC ||= new (window.AudioContext||window.webkitAudioContext)(); const T=AC.currentTime+t, o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,T); if(f2) o.frequency.exponentialRampToValueAtTime(f2,T+d); g.gain.setValueAtTime(v,T); g.gain.exponentialRampToValueAtTime(.0001,T+d); o.connect(g); g.connect(AC.destination); o.start(T); o.stop(T+d+.02); }catch(e){} }
function noise(d=.3,f=800,f2=5000,v=.2){ if(!SND) return; try{ AC ||= new (window.AudioContext||window.webkitAudioContext)(); const T=AC.currentTime, b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate), x=b.getChannelData(0); for(let i=0;i<x.length;i++) x[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=b; const fl=AC.createBiquadFilter(); fl.type='bandpass'; fl.frequency.setValueAtTime(f,T); fl.frequency.exponentialRampToValueAtTime(f2,T+d); const g=AC.createGain(); g.gain.setValueAtTime(v,T); g.gain.exponentialRampToValueAtTime(.0001,T+d); s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(T); }catch(e){} }
const S_={ tick:()=>tone(1760,{d:.012,v:.03}), rip:()=>noise(.35), click:()=>{ tone(300,{d:.04,v:.08,type:'triangle'}); tone(180,{t:.05,d:.05,v:.08,type:'triangle'}); },
  drop:()=>{ tone(500,{f2:120,d:.35,type:'triangle',v:.12}); }, crack:()=>noise(.08,1500,3000,.3), pop:()=>{ noise(.3,500,4000,.15); [1047,1319,1568,2093].forEach((f,i)=>tone(f,{t:.15+i*.04,d:.4,type:'sine',v:.05})); },
  flip:()=>tone(500,{f2:1000,d:.06,type:'triangle',v:.1}), base:()=>tone(880,{d:.06,v:.04}), hit:()=>{ [784,1047,1319].forEach((f,i)=>tone(f,{t:i*.07,d:.2,v:.05})); tone(1568,{t:.22,d:.5,type:'triangle',v:.08}); },
  star:()=>{ [523,659,784,1047,1319,1568,2093].forEach((f,i)=>tone(f,{t:i*.045,d:.3,v:.05})); }, boot:()=>{ tone(1047,{d:.08}); tone(2093,{t:.09,d:.5}); }, insert:()=>{ tone(200,{f2:90,d:.15,type:'triangle',v:.12}); tone(1200,{t:.18,d:.04,v:.04}); } };
document.getElementById('snd').onclick=e=>{ SND=!SND; e.target.textContent=SND?'🔊 SOUND ON':'🔇 SOUND OFF'; };

const st=document.getElementById('st');
const el=(h)=>{ const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const hint=t=>{ st.querySelector('.hint')?.remove(); if(t) st.appendChild(el(`<div class="hint">${t}</div>`)); };
const flash=()=>{ const f=st.querySelector('.flash')||st.appendChild(el('<div class="flash"></div>')); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); };
function burst(c,n=24){ const b=el('<div class="burst"></div>'); for(let i=0;i<n;i++){ const a=Math.random()*6.28, r=80+Math.random()*140; b.appendChild(el(`<i style="--c:${c};--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px"></i>`)); } st.appendChild(b); setTimeout(()=>b.remove(),1000); }

/* ── shared reveal: a stack in the middle; tap the top card to flip it, it moves to the fan ── */
const TNAME={ATL:'ATLANTA HAWKS',BOS:'BOSTON CELTICS',BKN:'BROOKLYN NETS',CHA:'CHARLOTTE HORNETS',CHI:'CHICAGO BULLS',CLE:'CLEVELAND CAVALIERS',DAL:'DALLAS MAVERICKS',DEN:'DENVER NUGGETS',DET:'DETROIT PISTONS',GSW:'GOLDEN STATE WARRIORS',HOU:'HOUSTON ROCKETS',IND:'INDIANA PACERS',LAC:'LA CLIPPERS',LAL:'LOS ANGELES LAKERS',MEM:'MEMPHIS GRIZZLIES',MIA:'MIAMI HEAT',MIL:'MILWAUKEE BUCKS',MIN:'MINNESOTA TIMBERWOLVES',NOP:'NEW ORLEANS PELICANS',NYK:'NEW YORK KNICKS',OKC:'OKLAHOMA CITY THUNDER',ORL:'ORLANDO MAGIC',PHI:'PHILADELPHIA 76ERS',PHX:'PHOENIX SUNS',POR:'PORTLAND TRAIL BLAZERS',SAC:'SACRAMENTO KINGS',SAS:'SAN ANTONIO SPURS',TOR:'TORONTO RAPTORS',UTA:'UTAH JAZZ',WAS:'WASHINGTON WIZARDS'};
const POSN={G:'GUARD',F:'FORWARD',C:'CENTER'}, PHX_={};
/* centre his head in the card (same rule as the Base Card Lab) */
window.pkHead=img=>{ const c=img.closest('.cd'), put=v=>c&&c.style.setProperty('--hx',v.toFixed(1)+'%'); if(PHX_[img.src]!=null) return put(PHX_[img.src]);

    if(c.r!=='base'){ e.style.setProperty('--tz',PC[c.r]); e.classList.add('hitglow'); }
    if(RANK[c.r]>=2 && !e.classList.contains('up')){ e.classList.add('tease','shake'); hint('A HIT! TAP TO FLIP'); }
    else { sparkle(e,c); hint(k===0?'TAP OR SWIPE FOR THE NEXT CARD':''); }
    busy=false; };
  function sparkle(e,c){ if(c.r==='base') return; const s=el(`<div class="spk" style="--sc:${PC[c.r]}">${[...Array(c.r==='star'?12:7)].map((_,i)=>`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${10+Math.random()*12}px;animation-delay:${Math.random()*1.4}s">✦</i>`).join('')}</div>`); e.appendChild(s); }
  setTimeout(()=>{ if(RUN===my) show(); },1150);
  st.onpointerdown=e=>{ if(busy||over) return; down={x:e.clientX}; const t=els[k]; if(t){ t.style.transition='none'; } };
  st.onpointermove=e=>{ if(!down||busy) return; const dx=e.clientX-down.x, t=els[k]; if(t && t.classList.contains('up')) t.style.transform=`translateX(${dx}px) rotate(${dx*.06}deg)`; };
  st.onpointerup=e=>{ if(!down||busy) return; const dx=e.clientX-down.x; down=null; const t=els[k], c=cards[k]; if(!t) return; t.style.transition='';
    if(!t.classList.contains('up')){ busy=true; t.classList.remove('shake'); t.classList.add('up'); S_.flip(); setTimeout(()=>{ t.classList.remove('tease'); flash(); burst(PC[c.r],c.r==='star'?44:28); c.r==='star'?S_.star():S_.hit(); sparkle(t,c); hint('SWIPE FOR THE NEXT CARD'); busy=false; },300); return; }
    busy=true; const dir=dx>25?1:-1; t.style.transform=`translate(${dir*W*1.1}px,-30px) rotate(${dir*22}deg)`; t.classList.add('gone'); S2.swish(); pips.innerHTML='';
    setTimeout(()=>t.style.display='none',450); k++; if(k>=cards.length){ over=true; setTimeout(done,350); } else setTimeout(show,260); };
  function done(){ if(RUN!==my || done.d) return; done.d=1; wo(()=>results(cards)); }
}
function results(cards){
  clr(); const my=RUN, W=st.clientWidth, H=st.clientHeight, rw=Math.min(104,W*.27), rh=rw*1.4, g=12, y1=H*.2, y2=y1+rh+30;
  const gain=cards.reduce((s,c)=>s+[10,25,50,100][RANK[c.r]],0), x0=XP, x1=Math.min(100,XP+gain/4);
  st.appendChild(el(`<div class="res-t">PACK RESULTS</div>`));
  st.appendChild(el(`<div class="lvl"><span>COLLECTOR LV 12</span><div class="bar"><i style="--w0:${x0}%"></i></div><b>+${gain} EXP</b></div>`));
  st.appendChild(el(`<div class="ppt">PACK POINTS <b>+5</b> · ${(145).toLocaleString()}</div>`));
  setTimeout(()=>{ const b=st.querySelector('.lvl .bar i'); if(b) b.style.width=x1+'%'; },60); XP=x1>=100?8:x1;
  const pos=cards.map((c,i)=>i<3?[W/2-(rw*1.5+g)+i*(rw+g),y1]:[W/2-(rw+g/2)+(i-3)*(rw+g),y2]);
  const els=cards.map((c,i)=>{ const e=cardEl(c); e.classList.add('rc','up','pop'); e.style.width=rw+'px'; e.style.left=pos[i][0]+'px'; e.style.top=pos[i][1]+'px'; e.style.animationDelay=(.25+i*.09)+'s'; st.appendChild(e);
    const dupe=Math.random()<.4; const t=el(`<div class="rtag ${dupe?'d':'n'}" style="left:${pos[i][0]}px;width:${rw}px;right:auto;top:${pos[i][1]+rh+7}px">${dupe?'DUPE · +40 EXP':'★ NEW'}</div>`); st.appendChild(t);
    setTimeout(()=>{ if(RUN===my) S2.pip(0); },250+i*90); return e; });
  const by=y2+rh+34; const b=el(`<button class="btnp" style="top:${Math.min(by,H-150)}px">NEXT ▶</button>`); st.appendChild(b);
  const bd=el('<div class="binder">CARDS</div>'), tot=el(`<div class="tot">COLLECTION<b>${COLL.toLocaleString()}</b></div>`); st.appendChild(bd); st.appendChild(tot);
  b.onclick=e=>{ e.stopPropagation(); b.remove(); st.querySelectorAll('.rtag,.lvl,.ppt,.res-t').forEach(x=>x.style.opacity=0); tot.style.opacity=1;
    const tx=W/2-rw/2, ty=H-16-44/2-rh/2;
    els.forEach((c,i)=>setTimeout(()=>{ if(RUN!==my) return; c.classList.remove('pop'); c.style.left=tx+'px'; c.style.top=ty+'px'; c.style.transform='scale(.18) rotate(-8deg)'; c.style.opacity='.0';
      setTimeout(()=>{ bd.classList.add('bump'); S2.thunk(); COLL++; tot.querySelector('b').textContent=COLL.toLocaleString(); setTimeout(()=>bd.classList.remove('bump'),140); },520); },i*130));
    PACKS--; setTimeout(()=>{ if(RUN===my) wo(shop); },cards.length*130+1500); };
}

const MODES={pro:['★ SIGNATURE',pro,'The <b>full flow</b>, built on the pacing of the best pack openers. Tap <b>OPEN</b>, then pick a pack from the spinning ring. <b>Swipe across the top</b> to cut it; the strip flies off, the cards rise out and the wrapper drops away. <b>Tap or swipe</b> through the cards one at a time, commons first and hits last. Rarity pips drop in under each card. A Holo or All-Star waits face-down until you flip it. Then come Pack Results with EXP and NEW/DUPE tags, and the cards fly into your binder.'],
  foil:['A · FOIL PACK',foilPack,'A classic crimped <b>foil wrapper</b> in the logo\'s blue-white-red chrome. Move your finger or mouse over it and the foil catches the light. <b>Drag across the top edge to tear it open</b>; the strip flies off and the cards slide up out of the wrapper.'],
  gacha:['B · CAPSULE MACHINE',gacha,'An arcade <b>capsule machine</b>. Tap the knob three times; each turn clicks and jostles the capsules. A capsule rolls into the chute. <b>Tap it three times to crack it</b>; on the last crack it glows the colour of your best card, then pops.'],
  cart:['C · CARTRIDGE',cartridge,'The pack is a <b>game cartridge</b>. Plug it into the handheld; it boots on the four-green screen, scans the pack (it tells you how many hits are inside), then the <b>cards shoot out of the slot</b> for the reveal.']};
function designs(){ st.classList.add('pro'); const g=el(`<div class="dgrid">${Object.entries(DESIGNS).map(([k,d])=>`<div class="dc ${k===DES?'on':''}" data-d="${k}"></div>`).join('')}</div>`); st.appendChild(g);
  const my=RUN; g.querySelectorAll('[data-d]').forEach((c,i)=>{ const p=packEl(120,c.dataset.d); c.appendChild(p); c.insertAdjacentHTML('beforeend',`<b>${DESIGNS[c.dataset.d].name}</b>`);
    c.onclick=()=>{ DES=c.dataset.d; MODE='pro'; tabs(); start(); }; });
  (function sw(){ if(RUN!==my) return; const t=performance.now()/1000; g.querySelectorAll('.pk').forEach((p,i)=>light(p,Math.sin(t*.7+i)*.3,Math.sin(t*.9+i*.6)*.2)); requestAnimationFrame(sw); })(); }
MODES.designs=['D · PACK DESIGNS',designs,'Six wrapper designs on the same realistic foil: the <b>classic blue foil</b>, and five with <b>player cut-outs over printed patterns</b> (halftone, sunburst, 8-bit, a two-player VS, neon). Every pack is printed with its run: <b>WINTER RUN \'27</b>, so older runs can come back later as retro packs. <b>Tap a design</b> to open it in the Signature flow.'];
let MODE='pro';
st.onpointercancel=e=>st.onpointerup&&st.onpointerup(e);
function start(){ RUN++; st.className='stage'; st.innerHTML=''; st.onclick=null; st.onpointermove=null; st.onpointerdown=null; st.onpointerup=null; MODES[MODE][1](); }
function tabs(){ document.getElementById('tabs').innerHTML=Object.entries(MODES).map(([k,[l]])=>`<button class="${k===MODE?'on':''}" data-m="${k}">${l}</button>`).join('');
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ MODE=b.dataset.m; tabs(); start(); }); document.getElementById('why').innerHTML=MODES[MODE][2]+(MODE==='pro'?'':' The reveal is the same in A, B and C: <b>tap to flip</b> each card. Hits glow and shake first, then flash and burst; base cards just flip. Then all five fan out.'); }
tabs(); start();
})();
</script>
