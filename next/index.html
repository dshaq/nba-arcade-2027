<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NBA Arcade · Next</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
/* Design prototype for the next home page, built from Dan's doodle.
   Same look as the live app: navy, pixel font, neon outlines, CRT lines. Sample data. */
:root{
  --px:'Press Start 2P',ui-monospace,monospace;
  --bg:#020c18; --bg2:#0a1628; --card:#0d1530; --edge:#1e3258;
  --t1:#fff; --t2:#a8c0e8; --t3:#506080;
  --green:#39ff6a; --pink:#ff5fbf; --orange:#f5a623; --gold:#ffd93d; --red:#e94560; --blue:#4a9eff; --teal:#00d4aa; --violet:#b36bff;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font-family:var(--px);overflow:hidden}
button{font-family:var(--px);color:inherit}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 38%,#0c1f3d 0%,var(--bg) 70%)}
#app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
canvas.dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.px{image-rendering:pixelated;image-rendering:crisp-edges}

/* ── top bar ── */
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.logo{font-size:15px;letter-spacing:.02em;text-shadow:0 3px 0 #000}
.logo b{color:var(--red);font-weight:normal}.logo i{color:var(--gold);font-style:normal}
.sp{flex:1}
.ibtn{position:relative;width:42px;height:42px;border-radius:50%;border:2px solid var(--edge);background:var(--card);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn svg{width:20px;height:20px}
.me{border-color:var(--gold);overflow:visible}
.me canvas{width:30px;height:30px}
.me .lv{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:6px;background:var(--gold);color:#1a1200;padding:2px 4px;border-radius:4px;white-space:nowrap}
.dot{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--red);border:2px solid var(--bg);font-size:6px;display:grid;place-items:center;color:#fff}

/* ── Missions strip (the day's progress bar) ── */
.mstrip{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 70px);z-index:5;
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:rgba(13,21,48,.85);border:2px solid var(--edge);cursor:pointer}
.mstrip .lab{font-size:7px;color:var(--gold);white-space:nowrap}
.pbar{flex:1;display:flex;gap:3px;height:12px}
.pbar span{flex:1;border-radius:2px;background:#16224a;box-shadow:inset 0 0 0 1px #24366a;transition:background .4s}
.pbar span.on{background:linear-gradient(180deg,#ffe98a,#f5a623);box-shadow:0 0 8px rgba(255,217,61,.55)}
.pbar span.pop{animation:pop .5s}
@keyframes pop{40%{transform:scaleY(1.6)}}
.mstrip .n{font-size:7px;color:var(--t2);white-space:nowrap}
.chest{font-size:14px;filter:grayscale(1) brightness(.6)}.chest.on{filter:none;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* ── home: the three big buttons, centred with room above and below ── */
.screen{position:absolute;inset:0;z-index:3;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 124px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(16px,env(safe-area-inset-left,0px))}
.screen.sub{padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
.home{display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:100%}
.box{position:relative;border-radius:14px;background:var(--card);border:3px solid var(--c);padding:14px;cursor:pointer;
  box-shadow:0 0 0 1px #000,0 0 18px color-mix(in srgb,var(--c) 30%,transparent),inset 0 0 22px color-mix(in srgb,var(--c) 10%,transparent);transition:transform .12s}
.box:active{transform:scale(.98)}
.box h2{margin:0;font-size:12px;font-weight:normal;letter-spacing:.04em;color:var(--t1);text-shadow:0 2px 0 #000}
.todo{display:flex;align-items:center;gap:7px;font-size:7px;line-height:1.5;color:var(--t1);margin-top:8px}
.todo .w{flex:none;width:16px;height:16px;display:grid;place-items:center;background:var(--red);color:#fff;font-size:8px;clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:4px;animation:blink 1.2s steps(2) infinite}
.todo.ok{color:var(--green)}.todo.ok .w{background:var(--green);color:#022;clip-path:none;border-radius:50%;padding:0;animation:none}
@keyframes blink{50%{opacity:.35}}

.fan{--c:var(--green);display:grid;grid-template-columns:1fr auto;gap:12px;min-height:200px}
.fan .eyebrow{font-size:6px;color:var(--t3);margin-top:6px}
.score{display:flex;align-items:center;gap:8px;margin:18px 0 6px}
.score b{font-weight:normal;font-size:26px;text-shadow:0 3px 0 #000}
.score b.lead{color:var(--green)}
.score .dash{flex:1;height:3px;background:var(--t3);min-width:14px;max-width:46px}
.teams{display:flex;justify-content:space-between;font-size:6px;color:var(--t2);max-width:200px;gap:8px}
.live{font-size:6px;color:var(--red);margin-top:8px}.live::before{content:'● ';animation:blink 1s steps(2) infinite}
.mvp{width:112px;align-self:center;text-align:center}
.pcard{position:relative;width:112px;height:126px;border:3px solid #000;outline:2px solid var(--gold);border-radius:6px;overflow:hidden;background:#1d428a}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.pcard .alt{position:absolute;top:4px;right:4px;font-size:5px;background:rgba(0,0,0,.7);padding:3px 4px;border-radius:3px;color:var(--gold)}
.plate{margin-top:6px;border:2px solid #000;background:#fff;color:#000;font-size:6.5px;padding:5px 0}
.mvp small{display:block;font-size:6px;color:var(--t2);margin-top:6px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duel{--c:var(--pink);min-height:184px;display:flex;flex-direction:column}
.chal{--c:var(--orange);min-height:184px;display:flex;flex-direction:column}
.duel h2,.chal h2{text-align:right}
.vs{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0 4px;flex:1}
.vs .f{width:52px;height:60px;border:2px solid #000;outline:2px solid var(--t1);border-radius:4px;overflow:hidden;position:relative;background:var(--tc,#333)}
.vs .f img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.vs .f.pick{outline-color:var(--green)}
.vs i{font-style:normal;color:var(--red);font-size:12px;text-shadow:0 2px 0 #000}
.tag{font-size:5.5px;color:var(--t2);text-align:center;line-height:1.6}
.banner{margin:14px auto 4px;flex:1;display:grid;place-items:center}
.allstar{font-size:12px;white-space:nowrap;color:var(--gold);background:var(--red);padding:9px 10px 7px;transform:rotate(-5deg);
  box-shadow:4px 4px 0 #000;border:2px solid #000;text-shadow:2px 2px 0 #8a1020;letter-spacing:-.02em}
.allstar small{display:block;font-size:5.5px;color:#fff;text-shadow:none;margin-top:5px;letter-spacing:.06em}

/* ── footer ── */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;align-items:center;
  padding:10px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(2,12,24,.6),#020c18 40%);border-top:2px solid var(--edge)}
.nav button{position:relative;width:52px;height:46px;border:none;background:none;cursor:pointer;border-radius:10px;display:grid;place-items:center;opacity:.6}
.nav button.on{opacity:1;background:rgba(74,158,255,.12)}
.nav svg{width:26px;height:26px}
.nav .dot{top:2px;right:6px}

/* ── sub-screens ── */
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.head h1{margin:0;font-size:15px;font-weight:normal;text-shadow:0 3px 0 #000}
.back{width:38px;height:38px;border-radius:8px;border:2px solid var(--edge);background:var(--card);cursor:pointer;font-size:12px}
.panel{background:var(--card);border:2px solid var(--edge);border-radius:12px;padding:14px;margin-bottom:14px}
.sec{font-size:7px;color:var(--t3);letter-spacing:.1em;margin:0 0 10px}
.bigbar{display:flex;align-items:center;gap:8px}
.bigbar .pbar{height:18px}
.reward{font-size:6.5px;color:var(--t2);line-height:1.8;margin-top:10px}
.reward b{color:var(--gold);font-weight:normal}
.mis{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--edge)}
.mis:first-of-type{border-top:none}
.mis .ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:17px;background:#16224a;flex:none}
.mis .tx{flex:1;min-width:0}
.mis .tx b{display:block;font-weight:normal;font-size:8px;line-height:1.5}
.mis .tx span{display:block;font-size:6px;color:var(--t3);margin-top:5px;line-height:1.6}
.mis .xp{font-size:7px;color:var(--gold);white-space:nowrap}
.go{font-size:7px;padding:9px 10px;border-radius:7px;border:2px solid #000;background:var(--gold);color:#1a1200;cursor:pointer;box-shadow:0 3px 0 #000;white-space:nowrap}
.go.done{background:transparent;border-color:var(--green);color:var(--green);box-shadow:none;cursor:default}
.soon{opacity:.45}
.btn{font-size:9px;padding:15px 24px;border-radius:10px;border:3px solid #000;background:var(--gold);color:#1a1200;box-shadow:0 5px 0 #000;cursor:pointer}
.btn.alt{background:var(--card);color:var(--t1);border-color:var(--edge);box-shadow:0 4px 0 #000}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #000}

/* Baller screen */
.bstage{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bstage .arrow{width:40px;height:56px;border-radius:8px;border:2px solid var(--edge);background:var(--card);font-size:14px;cursor:pointer}
.bstage .who{flex:1;text-align:center}
.bstage canvas{width:150px;height:150px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.5))}
.bname{font-size:12px;margin-top:8px}
.xpbar{height:12px;border-radius:6px;background:#16224a;overflow:hidden;margin:10px 0 6px;box-shadow:inset 0 0 0 1px #24366a}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,#4a9eff,#00d4aa);transition:width .6s}
.xpline{display:flex;justify-content:space-between;font-size:6px;color:var(--t2)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.un{border:2px solid var(--edge);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;background:#0b1229;position:relative}
.un canvas{width:48px;height:48px}
.un .l{font-size:5.5px;color:var(--t2);margin-top:4px;line-height:1.5}
.un.lock{cursor:default}.un.lock canvas{filter:brightness(0) opacity(.5)}
.un.lock .l{color:var(--t3)}
.un.sel{border-color:var(--green);box-shadow:0 0 10px rgba(57,255,106,.35)}
.un .lvtag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:5px;background:var(--edge);padding:2px 4px;border-radius:3px;white-space:nowrap}
.un.got .lvtag{background:var(--gold);color:#1a1200}
.active-pill{display:inline-block;font-size:6px;padding:4px 7px;border-radius:5px;background:var(--green);color:#022;margin-top:8px}

/* sheet / overlay */
.ov{position:absolute;inset:0;z-index:40;background:rgba(1,6,14,.75);display:flex;align-items:flex-end;animation:fade .2s}
.ov.center{align-items:center;justify-content:center}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:var(--bg2);border-top:3px solid var(--c,var(--edge));border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40%)}}
.sheet h3{margin:0 0 6px;font-size:11px;font-weight:normal}
.sheet p{font-size:7px;color:var(--t2);line-height:1.9;margin:0 0 14px}
.sheet .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pickrow{display:flex;gap:14px;justify-content:center;margin:6px 0 16px}
.pickrow button{border:3px solid var(--edge);border-radius:10px;background:var(--card);padding:8px;cursor:pointer;width:130px}
.pickrow button img{width:100%;height:120px;object-fit:cover;object-position:50% 10%;border-radius:5px;background:var(--tc)}
.pickrow button span{display:block;font-size:7px;margin-top:8px}
.pickrow button small{display:block;font-size:6px;color:var(--t3);margin-top:5px}
.menu a{display:flex;align-items:center;gap:12px;padding:13px 4px;font-size:8px;border-top:1px solid var(--edge);cursor:pointer;color:var(--t1);text-decoration:none}
.menu a:first-of-type{border-top:none}
.menu a span{font-size:16px;width:24px;text-align:center}
.menu a small{margin-left:auto;font-size:6px;color:var(--t3)}

/* daily greeting */
.greet{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));
  background:radial-gradient(90% 60% at 50% 40%,#123066,#020c18 75%)}
.greet .hi{font-size:7px;color:var(--t2);letter-spacing:.14em}
.greet h1{margin:0;font-size:17px;font-weight:normal;color:var(--gold);text-shadow:0 3px 0 #000,0 0 18px rgba(255,217,61,.4);line-height:1.4}
.greet canvas{width:132px;height:132px;animation:bob 1.4s ease-in-out infinite}
.recap{width:100%;max-width:340px;display:grid;gap:8px}
.recap>div{display:flex;align-items:center;gap:10px;background:rgba(13,21,48,.9);border:2px solid var(--edge);border-radius:10px;padding:10px 12px;font-size:7px;text-align:left;line-height:1.6;opacity:0;animation:in .4s forwards}
.recap>div>span{font-size:15px}
.recap b{font-weight:normal;color:var(--green)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* EXP pop + level up */
.xpfly{position:absolute;z-index:70;font-size:10px;color:var(--gold);text-shadow:0 2px 0 #000;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.6,1)}
.lvup{background:var(--bg2);border:3px solid var(--gold);border-radius:14px;padding:22px 20px;text-align:center;width:min(320px,88%);animation:zoom .35s}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
.lvup .rib{font-size:13px;color:var(--gold);text-shadow:0 3px 0 #000}
.lvup canvas{width:120px;height:120px;margin:12px 0}
.lvup p{font-size:7px;color:var(--t2);line-height:1.9;margin:0 0 16px}

/* portrait viewer (swipe through alternates) */
.pv{width:min(340px,92%);text-align:center}
.pv .vp{overflow:hidden;border-radius:12px;touch-action:pan-y}
.pv .trk{display:flex;transition:transform .3s ease-out}
.pv .slide{flex:0 0 100%;padding:6px}
.pv .pcard{width:100%;height:340px;outline-width:3px}
.pv .pcard img{object-position:50% 8%}
.pv .nm{font-size:10px;margin:14px 0 6px}
.pv .vn{font-size:7px;color:var(--gold)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:2px;background:#24366a}.dots i.on{background:var(--gold)}
.lockcov{position:absolute;inset:0;background:rgba(2,6,16,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:7px;color:var(--t2);line-height:1.8}
.lockcov span{font-size:26px}
/* stand-in treatments until real alternate art exists */
.v-holo::after{content:'';position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:.55;background:linear-gradient(115deg,transparent 20%,#ff5fbf 35%,#ffd93d 45%,#39ff6a 55%,#4a9eff 65%,transparent 80%);background-size:250% 250%;animation:holo 3s linear infinite}
@keyframes holo{from{background-position:100% 0}to{background-position:-100% 0}}
.v-neon img{filter:grayscale(1) contrast(1.3) brightness(1.05)}
.v-neon::after{content:'';position:absolute;inset:0;mix-blend-mode:color;background:linear-gradient(160deg,#ff2e88,#00e5ff)}
.v-gold{outline-color:#fff6c0!important}
.v-gold img{filter:sepia(1) saturate(2.2) hue-rotate(-8deg) contrast(1.15) brightness(1.05)}
.v-gold::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 5px #f5a623,inset 0 0 26px rgba(255,217,61,.6)}
.v-retro img{filter:contrast(1.6) saturate(1.6)}
.v-retro::after{content:'';position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.45) 30%,transparent 32%) 0 0/4px 4px;mix-blend-mode:multiply}

.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);z-index:80;font-size:7px;padding:9px 14px;border-radius:8px;background:var(--green);color:#022;border:2px solid #000;box-shadow:0 3px 0 #000;white-space:nowrap}
.proto{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:4;font-size:5px;color:var(--t3);letter-spacing:.1em;white-space:nowrap}
#dissolve{position:absolute;inset:0;width:100%;height:100%;z-index:85;image-rendering:pixelated;pointer-events:none}
@media (max-width:370px){.fan{grid-template-columns:1fr}.mvp{justify-self:center}.score b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas class="dust" id="dust"></canvas>
  <div id="ui"></div>
  <nav class="nav" id="nav"></nav>
  <canvas id="dissolve" hidden></canvas>
</div>
<script src="../balls.js"></script>
<script>
/* ── Sample data (prototype). The real build reads the league. ───────────── */
const PORTRAITS = 'https://ipsngddnavymcmfbbcxu.supabase.co/storage/v1/object/public/player-portraits';
const pimg = (team,name) => `${PORTRAITS}/${team}/${encodeURIComponent(name)}.jpeg`;
const SIL = 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 70"><rect width="60" height="70" fill="#1e3258"/><circle cx="30" cy="26" r="13" fill="#506080"/><path d="M6 70c2-18 12-26 24-26s22 8 24 26z" fill="#506080"/></svg>');
const ME  = {name:'Dave', team:'Pixel Pushers'};
const OPP = {name:'Riley', team:'Fast Break Bandits'};
const MU  = {me:94, opp:86, week:3};
const MVP = {id:'sga', name:'Shai Gilgeous-Alexander', team:'OKC', tc:'#007ac1', fp:'52.4 FP/G'};
const DUEL = {title:'Wet Wednesday', lock:'7:00 PM',
  a:{name:'Tyrese Maxey', short:'MAXEY', team:'PHI', tc:'#006bb6'},
  b:{name:'Devin Booker', short:'BOOKER', team:'PHX', tc:'#e56020'}};
const WLC = {pool:'ALL-STAR', sub:'5 FOR $15'};

/* Alternate portraits. The real ones would be new art; these are look-alike treatments for now. */
const VARIANTS = [
  {k:'base',  name:'CLASSIC'},
  {k:'holo',  name:'HOLO FOIL'},
  {k:'neon',  name:'NEON'},
  {k:'retro', name:'RETRO PRINT', lock:true},
  {k:'gold',  name:'GOLD', lock:true},
];

/* Missions. Each to-do lives in the box for its area, and finishing it fills the day's bar. */
const MISSIONS = [
  {k:'checkin', ic:'👋', t:'Check in',               d:'Open the app today',                 xp:10, area:'home'},
  {k:'lineup',  ic:'🏀', t:'Set your line-up',       d:'Fantasy · 1 empty slot Thursday',     xp:20, area:'fantasy'},
  {k:'duel',    ic:'⚡', t:"Make today's Duel pick", d:`${DUEL.a.short} or ${DUEL.b.short} · locks ${DUEL.lock}`, xp:20, area:'duel'},
  {k:'futures', ic:'🔮', t:'Make your Futures pick',  d:'NBA Cup · East Group B',              xp:15, area:'duel'},
  {k:'wlc',     ic:'⭐', t:'Enter the Challenge',     d:`${WLC.pool} · this week`,             xp:25, area:'wlc'},
];
const FULL_BONUS = 50;

/* Baller levels: each Baller keeps its own EXP; levels unlock looks for that Baller. */
const need = lv => 60 + lv*40;                          // EXP from lv to lv+1
const TRACK = [ // [level, kind, value]
  [1,'cw',0],[2,'cw',1],[3,'face','shades'],[4,'cw',2],[5,'head','band'],[6,'cw',3],[7,'cw',4],[8,'head','helmet'],[9,'cw',5],[10,'face','visor']];

const B = ch => (S.ballers[ch] ||= {exp:0, cw:0, head:null, face:null});
function lvOf(exp){ let lv=1; while(exp>=need(lv)){ exp-=need(lv); lv++; } return {lv, into:exp, next:need(lv)}; }
const doneCount = () => MISSIONS.filter(m=>S.done[m.k]).length;

/* ── Baller drawing with unlockable gear ─────────────────────────────────── */
function drawBaller(cv, ch, scale, look){
  look = look || B(ch);
  const cws = BB.COLORWAYS[ch] || [['Original',{}]];
  const pick = Object.assign(BB.fresh(ch), (cws[look.cw]||cws[0])[1]);
  BB.draw(cv, pick, ch, scale);
  const D=BB.CHARS[ch].data, Sz=BB.size(ch), ox=Math.floor((Sz-D.w)/2), oy=Sz-D.h, c=cv.getContext('2d');
  const body=D.cells.filter(x=>x[2]!=='O'), ys=body.map(x=>x[1]), top=Math.min(...ys), h=Math.max(...ys)-top;
  const put=(x,y,col)=>{ c.fillStyle=col; c.fillRect((x+ox)*scale,(y+oy)*scale,scale,scale); };
  if(look.head==='band'){ const y0=top+Math.round(h*.2);
    body.filter(x=>x[1]===y0||x[1]===y0+1).forEach(x=>put(x[0],x[1], x[1]===y0?'#ff3b5c':'#b3152e')); }
  if(look.head==='helmet'){ const lim=top+Math.round(h*.3), xs=body.map(x=>x[0]), mid=(Math.min(...xs)+Math.max(...xs))/2;
    body.filter(x=>x[1]<=lim).forEach(x=>put(x[0],x[1], Math.abs(x[0]-mid)<1.2?'#ffffff':x[1]<=top+1?'#ffe98a':'#f5a623')); }
  if(look.face){ const e=BB.eyes && BB.eyes(ch); let cells;
    if(e){ cells=[...e.map.keys()].map(k=>k.split(',').map(Number)); }
    else { const y0=top+Math.round(h*.42); cells=body.filter(x=>x[1]===y0).map(x=>[x[0],x[1]]); }
    const xs=cells.map(p=>p[0]), ys2=cells.map(p=>p[1]), x0=Math.min(...xs)-1, x1=Math.max(...xs)+1, y0=Math.min(...ys2), y1=Math.max(Math.max(...ys2), y0+1);
    const lens = look.face==='visor' ? ['#7ff3ff','#00c8e8'] : ['#3a3a52','#0c0a14'];
    body.filter(x=>x[0]>=x0&&x[0]<=x1&&x[1]>=y0&&x[1]<=y1).forEach(x=>put(x[0],x[1], x[1]===y0?lens[0]:lens[1]));
    if(look.face==='shades'){ put(x0+1,y0+1,'#ffffff'); put(Math.round((x0+x1)/2)+2,y0+1,'#ffffff'); }
  }
  return cv;
}
const ballerCv = (ch, scale, look) => { const cv=document.createElement('canvas'); cv.className='px'; return drawBaller(cv, ch, scale, look); };
const cwName = (ch,i) => ((BB.COLORWAYS[ch]||[])[i]||['—'])[0];
const gearName = {shades:'SHADES', band:'SWEATBAND', helmet:'HELMET', visor:'VISOR'};

}

function missions(){
  const n=doneCount(), all=n===MISSIONS.length, a=S.active;
  return topBar()+`<div class="screen"><div class="head"><button class="back" onclick="go('home')">◀</button><h1>MISSIONS</h1></div>
    <div class="panel"><div class="sec">TODAY · RESETS 12 AM ET</div>
      <div class="bigbar"><div class="pbar" id="pbar">${MISSIONS.map((m,i)=>`<span class="${i<n?'on':''}"></span>`).join('')}</div><span class="chest ${all?'on':''}" style="font-size:20px">🎁</span></div>
      <div class="reward">${all?(S.bonus?'✓ BONUS COLLECTED':''):`FILL THE BAR: <b>+${FULL_BONUS} EXP</b> AND A <b>PORTRAIT UNLOCK</b>`}</div>
      ${all&&!S.bonus?'<div style="text-align:center;margin-top:12px"><button class="btn" onclick="claim()">OPEN REWARD 🎁</button></div>':''}

    <div class="panel"><div class="sec">DAILY</div>
      ${MISSIONS.map(m=>`<div class="mis"><span class="ic">${m.ic}</span><div class="tx"><b>${m.t}</b><span>${m.d}</span></div>
        ${S.done[m.k]?'<button class="go done">✓ DONE</button>':`<button class="go" onclick="openSheet('${m.k}')">+${m.xp} EXP ▶</button>`}</div>`).join('')}

function xpBlock(ch){ const L=lvOf(B(ch).exp);
  return `<div style="font-size:9px">${BB.CHARS[ch].name} <span style="color:var(--gold)">LV ${L.lv}</span></div>
    <div class="xpbar"><span style="width:${100*L.into/L.next}%"></span></div><div class="xpline"><span>${L.into} / ${L.next} EXP</span><span>NEXT: ${nextReward(ch)}</span></div>`; }
function nextReward(ch){ const L=lvOf(B(ch).exp).lv; const r=TRACK.find(t=>t[0]>L); return r ? `LV ${r[0]} ${r[1]==='cw'?cwName(ch,r[2]).toUpperCase():gearName[r[2]]}` : 'ALL UNLOCKED'; }

let bi = null;
function baller(){
  const list=[...BB.ORDER, ...BB.SECRET.filter(s=>(S.secrets||[]).includes(s))];
  if(bi==null) bi=Math.max(0,list.indexOf(S.active));
  const ch=list[(bi%list.length+list.length)%list.length], L=lvOf(B(ch).exp).lv, me=B(ch);
  const tiles=TRACK.map(([lv,kind,val])=>{
    const got=L>=lv, look={...me}; if(kind==='cw') look.cw=val; else look[kind]=val;
    const sel = kind==='cw' ? me.cw===val : me[kind]===val;
    const lab = kind==='cw' ? cwName(ch,val).toUpperCase() : gearName[val];
    if(kind==='cw' && !(BB.COLORWAYS[ch]||[])[val]) return '';
    return `<div class="un ${got?'got':'lock'} ${sel&&got?'sel':''}" data-k="${kind}" data-v="${val}" data-lv="${lv}"><span class="lvtag">LV ${lv}</span><span class="cvs" data-look='${JSON.stringify(look)}'></span><div class="l">${got?lab:'🔒 '+lab}</div></div>`; }).join('');
  return topBar()+`<div class="screen"><div class="head"><button class="back" onclick="go('home')">◀</button><h1>BALLERS</h1></div>
    <div class="panel"><div class="bstage"><button class="arrow" onclick="bi--;render()">◀</button>
      <div class="who"><span id="bigb" data-ch="${ch}"></span>
        ${S.active===ch?'<div class="active-pill">EARNING EXP</div>':`<button class="go" style="margin-top:8px" onclick="setActive('${ch}')">PLAY AS ${BB.CHARS[ch].name}</button>`}</div>
      <button class="arrow" onclick="bi++;render()">▶</button></div>
      <div style="margin-top:14px">${xpBlock(ch)}</div></div>
    <div class="panel"><div class="sec">${BB.CHARS[ch].name}'S UNLOCKS · TAP TO WEAR</div><div class="track" id="track">${tiles}</div>
      <div class="reward">Every Baller levels up on its own. The one you play as earns the EXP from Missions.</div>
      <div style="text-align:center;margin-top:12px"><button class="go" style="background:var(--card);color:var(--t2);border-color:var(--edge)" onclick="gain(100,null,'${ch}')">+100 EXP (PREVIEW ONLY)</button></div></div>
  </div>`;
}
const SCREENS={home, missions, baller};
const AFTER={};
function render(){
  document.getElementById('ui').innerHTML = SCREENS[cur]();
  const mb=document.getElementById('mebtn'); if(mb) mb.appendChild(ballerCv(S.active,1));
  const mx=document.getElementById('mxb'); if(mx){ const c=ballerCv(S.active,2); c.style.width='64px'; c.style.height='64px'; mx.appendChild(c); }
  const bb=document.getElementById('bigb'); if(bb) bb.appendChild(ballerCv(bb.dataset.ch,4));
  document.querySelectorAll('#track .cvs').forEach(el=>{ const ch=document.getElementById('bigb').dataset.ch; el.appendChild(ballerCv(ch,2,JSON.parse(el.dataset.look))); });
  document.querySelectorAll('#track .un.got').forEach(el=>el.onclick=()=>{ const ch=document.getElementById('bigb').dataset.ch, me=B(ch), k=el.dataset.k, v=k==='cw'?+el.dataset.v:el.dataset.v;
    if(k==='cw') me.cw=v; else me[k] = me[k]===v ? null : v; save(); render(); });
  (AFTER[cur]||(()=>{}))();
  nav();
}
function nav(){
  const need = a => MISSIONS.some(m=>m.area===a && !S.done[m.k]);
  const items=[['home',I.home,()=>go('home')],['fantasy',I.ball,()=>go('fantasy'),need('fantasy')],['wlc',I.orb,()=>go('wlc'),need('wlc')],['duel',I.bolt,()=>go('duel'),need('duel')],['menu',I.menu,openMenu]];
  const el=document.getElementById('nav'); el.innerHTML='';
  items.forEach(([k,ic,fn,dot])=>{ const b=document.createElement('button'); b.className=(k===cur||(k==='duel'&&cur==='futures'))?'on':''; b.innerHTML=ic+(dot?'<span class="dot"></span>':''); b.setAttribute('aria-label',k); b.onclick=fn; el.appendChild(b); });
}

/* ── Sheets: stand-ins for each area so the to-do → bar → EXP loop can be tried ── */
function overlay(html, center){ const o=document.createElement('div'); o.className='ov'+(center?' center':''); o.innerHTML=html;
  o.addEventListener('click',e=>{ if(e.target===o) o.remove(); }); document.getElementById('app').appendChild(o); return o; }
function openSheet(k){
  if(k==='checkin'){ greet(true); return; }
  const route={lineup:'fantasy', duel:'duel', futures:'futures', wlc:'wlc'}[k];
  if(route && SCREENS[route]){ if(k==='lineup') FZ.tab='inv'; go(route); return; }
  const m=MISSIONS.find(x=>x.k===k);
  if(k==='duel'){
    const o=overlay(`<div class="sheet" style="--c:var(--pink)"><h3>DAILY DUEL · ${DUEL.title.toUpperCase()}</h3><p>Who scores more fantasy points tonight? Your pick is final as soon as you tap.</p>
      <div class="pickrow">${[DUEL.a,DUEL.b].map(p=>`<button data-p="${p.short}" ${S.done.duel?'disabled':''} style="${S.done.duel===p.short?'border-color:var(--green)':''}"><img src="${pimg(p.team,p.name)}" onerror="this.onerror=null;this.src='${SIL}'" style="--tc:${p.tc}" alt=""><span>${p.short}</span><small>${p.team}</small></button>`).join('')}</div>
      <div class="acts">${S.done.futures?'<span class="todo ok"><span class="w">✓</span>FUTURES PICK IN</span>':'<button class="btn alt" id="fut">FUTURES PICK ▶</button>'}</div></div>`);
    o.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ if(S.done.duel) return; o.remove(); complete('duel', b, b.dataset.p); });
    const f=o.querySelector('#fut'); if(f) f.onclick=()=>{ o.remove(); openSheet('futures'); };
    return;
  }
  const copy={
    lineup:['FANTASY · THURSDAY','You have an empty active slot on Thursday. (Preview: this stands in for the roster screen.)','MARK LINE-UP SET','var(--green)'],
    futures:['FUTURES · NBA CUP EAST B','Who wins the group? Final on tap. (Preview: stands in for the Futures card.)','PICK KNICKS','var(--violet)'],
    wlc:[`WEEKLY CHALLENGE · ${WLC.pool}`,'Five players for $15. (Preview: stands in for the Challenge screen.)','SAVE MY ENTRY','var(--orange)'],
  }[k];
  const done=S.done[k];
  const o=overlay(`<div class="sheet" style="--c:${copy[3]}"><h3>${copy[0]}</h3><p>${copy[1]}</p>
    <div class="acts">${done?'<span class="todo ok"><span class="w">✓</span>DONE FOR TODAY</span>':`<button class="btn" id="do">${copy[2]} · +${m.xp} EXP</button>`}</div></div>`);
  const d=o.querySelector('#do'); if(d) d.onclick=()=>{ o.remove(); complete(k, d); };
}
function openMenu(){
  const o=overlay(`<div class="sheet"><h3>MORE</h3><div class="menu">
    <a data-a="missions"><span>🎯</span>Missions<small>${doneCount()}/${MISSIONS.length} TODAY</small></a>
    <a data-a="baller"><span>🎨</span>Ballers<small>LV ${lvOf(B(S.active).exp).lv}</small></a>
    <a data-a="x"><span>🏆</span>Standings</a><a data-a="x"><span>📜</span>Transactions</a><a data-a="x"><span>📖</span>Rules</a><a data-a="x"><span>⚙️</span>Settings</a>

/* ── Doing a to-do: EXP flies to the bar, the bar fills, the Baller levels up ── */
function complete(k, fromEl, val){
  const m=MISSIONS.find(x=>x.k===k); if(S.done[k]) return;
  S.done[k]=val||true; save(); render();
  gain(m.xp, fromEl);
  const n=doneCount(), bar=document.getElementById('pbar'); if(bar){ const seg=bar.children[n-1]; seg&&seg.classList.add('pop'); }
  if(n===MISSIONS.length) setTimeout(()=>say('🎁 Bar full! Open your reward in Missions'),900);
}
function gain(xp, fromEl, ch){
  ch = ch||S.active; const before=lvOf(B(ch).exp).lv; B(ch).exp+=xp; save();
  const app=document.getElementById('app'), r=app.getBoundingClientRect();
  const f=document.createElement('div'); f.className='xpfly'; f.textContent=`+${xp} EXP`;
  const s=(fromEl&&fromEl.isConnected?fromEl:document.querySelector('.nav')).getBoundingClientRect();
  f.style.left=(s.left-r.left+s.width/2-30)+'px'; f.style.top=(s.top-r.top)+'px'; app.appendChild(f);
  const tgt=(document.querySelector('.me')||document.querySelector('.xpbar')||app).getBoundingClientRect();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.left=(tgt.left-r.left-20)+'px'; f.style.top=(tgt.top-r.top+10)+'px'; f.style.opacity='0'; f.style.transform='scale(.6)'; }));
  setTimeout(()=>{ f.remove(); render(); const after=lvOf(B(ch).exp).lv; if(after>before) levelUp(ch, after); }, 850);
}
function levelUp(ch, lv){
  const got=TRACK.filter(t=>t[0]===lv).map(([,k,v])=>k==='cw'?cwName(ch,v)+' colors':gearName[v].toLowerCase()).join(', ');
  const o=overlay(`<div class="lvup"><div class="rib">LEVEL UP!</div><span id="lvc"></span><p>${BB.CHARS[ch].name} reached LV ${lv}.${got?`<br>Unlocked: <span style="color:var(--gold)">${got}</span>`:''}</p><button class="btn">NICE ▶</button></div>`, true);
  const look={...B(ch)}; const t=TRACK.find(x=>x[0]===lv); if(t){ if(t[1]==='cw') look.cw=t[2]; else look[t[1]]=t[2]; }
  o.querySelector('#lvc').appendChild(ballerCv(ch,4,look));
  o.querySelector('.btn').onclick=()=>o.remove();
}
function claim(){
  S.bonus=true; const nxt=VARIANTS.find(v=>v.lock && !S.unlocked.includes(v.k)); if(nxt) S.unlocked.push(nxt.k); save();
  gain(FULL_BONUS, document.querySelector('.btn'));
  if(nxt) setTimeout(()=>{ say(`New portrait: ${nxt.name}`); openPortrait(VARIANTS.indexOf(nxt)); }, 1700);
}
function setActive(ch){ S.active=ch; save(); render(); say(`${BB.CHARS[ch].name} earns your EXP now`); }

function openPortrait(start){
  const curV=S.portraits[MVP.id]||'base'; let i = start!=null ? start : Math.max(0,VARIANTS.findIndex(v=>v.k===curV));
  const isLocked = v => v.lock && !S.unlocked.includes(v.k);
  const o=overlay(`<div class="pv"><div class="vp"><div class="trk">${VARIANTS.map(v=>`<div class="slide"><div class="pcard ${v.k==='base'?'':'v-'+v.k}" style="background:${MVP.tc}">${img(pimg(MVP.team,MVP.name))}${isLocked(v)?'<div class="lockcov"><span>🔒</span>FILL YOUR MISSIONS BAR<br>TO UNLOCK</div>':''}</div></div>`).join('')}</div></div>
    <div class="nm">${MVP.name.toUpperCase()}</div><div class="vn" id="vn"></div><div class="dots" id="dts"></div>
    <div class="acts" style="display:flex;gap:10px;justify-content:center"><button class="btn alt" id="pp">◀</button><button class="btn" id="use"></button><button class="btn alt" id="nx">▶</button></div></div>`, true);
  const trk=o.querySelector('.trk');
  const show=()=>{ i=Math.max(0,Math.min(VARIANTS.length-1,i)); trk.style.transform=`translateX(${-100*i}%)`; const v=VARIANTS[i];
    o.querySelector('#vn').textContent=v.name; o.querySelector('#dts').innerHTML=VARIANTS.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('');
    const u=o.querySelector('#use'); const using=(S.portraits[MVP.id]||'base')===v.k;
    u.textContent = isLocked(v)?'🔒 LOCKED':using?'✓ IN USE':'USE THIS'; u.disabled=isLocked(v)||using; u.style.opacity=u.disabled?.5:1; };
  o.querySelector('#pp').onclick=()=>{i--;show();}; o.querySelector('#nx').onclick=()=>{i++;show();};
  o.querySelector('#use').onclick=()=>{ S.portraits[MVP.id]=VARIANTS[i].k; save(); show(); render(); say('Saved · it\'ll look like this next time too'); };
  let x0=null; const vp=o.querySelector('.vp');
  vp.addEventListener('pointerdown',e=>{x0=e.clientX;}); vp.addEventListener('pointerup',e=>{ if(x0==null) return; const dx=e.clientX-x0; x0=null; if(Math.abs(dx)>30){ i+= dx<0?1:-1; show(); } });
  show();
}

/* ── Daily greeting: first visit of the day; CONTINUE checks you in ───────── */
function greet(replay){
  const hr=+new Date().toLocaleString('en-US',{timeZone:'America/New_York',hour:'numeric',hour12:false});
  const hi = hr<12?'GOOD MORNING':hr<17?'GOOD AFTERNOON':'GOOD EVENING';
  const g=document.createElement('div'); g.className='greet';
  g.innerHTML=`<div class="hi">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'America/New_York'}).toUpperCase()}</div>
    <h1>${hi},<br>${ME.name.toUpperCase()}!</h1><span id="gb"></span>
    <div class="recap">
      <div style="animation-delay:.2s"><span>⚡</span><div>Yesterday's Duel: <b>you called it</b>. Barnes beat Sengun 41–37. Streak 🔥3.</div></div>
      <div style="animation-delay:.45s"><span>🏀</span><div>Fantasy: you're up <b>${MU.me}–${MU.opp}</b> on ${OPP.name}.</div></div>
      <div style="animation-delay:.7s"><span>🎯</span><div>${MISSIONS.length-1} missions waiting today.</div></div>
    </div>
    <button class="btn" id="cont">CONTINUE ▶</button>`;
  g.querySelector('#gb').appendChild(ballerCv(S.active,4));
  g.querySelector('#cont').onclick=()=>{ S.greeted=true; save(); dissolve(()=>{ g.remove(); render(); }, '#020c18').then(()=>{ if(!S.done.checkin) complete('checkin', document.querySelector('.mstrip')); }); };
  document.getElementById('app').appendChild(g);
}

/* ── Fairy dust (kept from the last preview, retuned for the navy) ───────── */
function dust(cv){
  const ctx=cv.getContext('2d'); let W,H; const motes=[...Array(42)].map(()=>({x:Math.random(),y:Math.random(),z:.3+Math.random()*.9,v:.02+Math.random()*.05,p:Math.random()*6,c:Math.random()<.7?'255,226,160':'150,220,255'}));
  const size=()=>{ W=cv.width=cv.clientWidth*devicePixelRatio; H=cv.height=cv.clientHeight*devicePixelRatio; }; size(); addEventListener('resize',size);
  (function f(t){ ctx.clearRect(0,0,W,H);
    for(const m of motes){ m.y-=m.v*.0016; m.x+=Math.sin(t/1800+m.p)*.00025; if(m.y<-.05){m.y=1.05;m.x=Math.random();}
      const a=.25+.4*Math.sin(t/900+m.p); const s=Math.max(1,(m.z*2.4)|0)*devicePixelRatio;
      ctx.fillStyle=`rgba(${m.c},${Math.max(0,a)*m.z})`; ctx.fillRect((m.x*W)|0,(m.y*H)|0,s,s); }
    requestAnimationFrame(f); })(0);
}

/* ── RPG pixel dissolve between screens ──────────────────────────────────── */
let busy=false;
function dissolve(swap, color='#020c18'){
  const cv=document.getElementById('dissolve'), app=document.getElementById('app');
  const Bk=12, cols=Math.ceil(app.clientWidth/Bk), rows=Math.ceil(app.clientHeight/Bk);
  cv.width=cols; cv.height=rows; cv.hidden=false; const c=cv.getContext('2d');
  const cells=[...Array(cols*rows).keys()].sort(()=>Math.random()-.5), N=cells.length, T=200;
  return new Promise(done=>{ const t0=performance.now();
    (function cover(t){ const k=Math.min(N,Math.round(N*(t-t0)/T)); c.clearRect(0,0,cols,rows); c.fillStyle=color;
      for(let i=0;i<k;i++){ const v=cells[i]; c.fillRect(v%cols,(v/cols)|0,1,1); }
      if(k<N) requestAnimationFrame(cover); else { swap(); const t1=performance.now();
        (function rev(t){ const k2=Math.min(N,Math.round(N*(t-t1)/T)); c.clearRect(0,0,cols,rows); c.fillStyle=color;
          for(let i=k2;i<N;i++){ const v=cells[i]; c.fillRect(v%cols,(v/cols)|0,1,1); }
          if(k2<N) requestAnimationFrame(rev); else { cv.hidden=true; done(); } })(t1); } })(t0); });
}
async function go(k){ if(busy||k===cur) return; busy=true; if(k==='baller') bi=null; await dissolve(()=>{ cur=k; render(); }); busy=false; }
function say(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.getElementById('app').appendChild(d); setTimeout(()=>d.remove(),1800); }

dust(document.getElementById('dust'));
render();
if(!S.greeted) greet();
