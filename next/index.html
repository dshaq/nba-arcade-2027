<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NBA Arcade · Next</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&display=swap" rel="stylesheet"/>
<style>
/* ── NBA ARCADE · NEXT (design prototype) ─────────────────────────────────────
   HD-2D direction: crisp pixel sprites standing in a lit, softly blurred arena
   (tilt-shift depth of field, warm light, haze, dust), with a TCG Pocket-style
   hub: one hero, two big tiles, a To-Do button, icon nav with red "!" badges. */
:root{
  --px:'Press Start 2P',monospace; --disp:'Bungee','Press Start 2P',sans-serif;
  --ink:#fff7e6; --ink2:#d9c9a8; --ink3:#9a8a6e;
  --panel:rgba(18,14,30,.72); --panel-edge:rgba(255,214,140,.28);
  --gold:#ffcc4d; --gold2:#ff9a2e; --red:#ff3b4f; --teal:#2ee6c5; --blue:#4aa8ff; --violet:#a46bff;
  --bg:#0c0814;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--px);overflow:hidden}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:#000}
canvas.px,img.px{image-rendering:pixelated}

/* ── SCENE (the diorama) ── */
.scene{position:absolute;inset:0;overflow:hidden}
.scene .far{position:absolute;inset:-6% -6% 30% -6%;width:112%;height:76%;filter:blur(5px) saturate(1.15) brightness(.95);transform:scale(1.04)}
.scene .court{position:absolute;left:-10%;width:120%;height:30%;bottom:calc(var(--castB) - 17%);transition:bottom .01s}
#app{--castB:52%}
#app[data-stage="section"]{--castB:60%}
#app[data-stage="section"] .cast{justify-content:flex-end;padding-right:8%}
#app[data-stage="section"] .scene .far{inset:-6% -6% 38% -6%;height:70%}
.scene .near{position:absolute;inset:auto -8% -4% -8%;height:30%;width:116%;filter:blur(7px)}
.scene .grade{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% 20%, rgba(255,190,90,.30), transparent 60%),
    linear-gradient(180deg, rgba(255,160,60,.10), rgba(40,10,60,.28) 70%, rgba(0,0,0,.55));
  mix-blend-mode:soft-light}
.scene .rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background:conic-gradient(from 200deg at 50% -10%, transparent 0 8deg, rgba(255,220,150,.18) 10deg 13deg, transparent 15deg 22deg, rgba(255,220,150,.14) 24deg 26deg, transparent 28deg 40deg, rgba(255,220,150,.12) 42deg 45deg, transparent 47deg);
  animation:rays 9s ease-in-out infinite alternate}
@keyframes rays{to{transform:translateX(-4%) rotate(1.5deg);opacity:.4}}
.scene .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(85% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.65))}
.scene canvas.dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.cast{position:absolute;left:0;right:0;bottom:var(--castB);display:flex;justify-content:center;align-items:flex-end;gap:6%;pointer-events:none}
.cast .who{position:relative;display:flex;flex-direction:column;align-items:center;animation:bob 1.6s steps(2,end) infinite}
.cast .who:nth-child(2){animation-delay:.4s}.cast .who:nth-child(3){animation-delay:.8s}
.cast .who canvas{width:clamp(54px,17vw,82px);height:auto;filter:drop-shadow(0 0 1px rgba(0,0,0,.6)) drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.cast .who.me canvas{width:clamp(72px,23vw,108px)}
.cast .who::after{content:'';position:absolute;bottom:-5px;width:70%;height:8px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(2px);z-index:-1}
.cast .tag{margin-top:7px;font-size:6px;letter-spacing:.08em;color:var(--ink);text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8)}
@keyframes bob{50%{transform:translateY(-3px)}}

/* ── UI LAYER ── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 74px)}
.top{display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.me-chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:30px;background:var(--panel);border:1px solid var(--panel-edge);backdrop-filter:blur(8px)}
.me-chip canvas{width:30px;height:30px}
.me-chip b{font-size:7px;font-weight:normal;display:block}
.me-chip i{font-style:normal;font-size:5px;color:var(--gold);display:block;margin-top:4px}
.top .sp{flex:1}
.ibtn{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--panel-edge);backdrop-filter:blur(8px);font-size:16px;cursor:pointer}
.dot{position:absolute;top:-2px;right:-2px;min-width:14px;height:14px;border-radius:7px;background:var(--red);border:2px solid #1a0f1f;font-size:6px;display:grid;place-items:center;color:#fff;font-family:var(--px)}
.dot:empty{min-width:10px;height:10px;top:0;right:0}

.hero-space{flex:1 1 auto;min-height:150px}
.card{position:relative;border-radius:18px;background:var(--panel);border:1px solid var(--panel-edge);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,240,200,.15)}
.hero{padding:14px 14px 12px;cursor:pointer}
.eyebrow{font-size:6px;letter-spacing:.14em;color:var(--gold)}
.hero .mu{margin-top:10px}
.hero h2{font-family:var(--disp);font-weight:normal;font-size:20px;letter-spacing:.02em;margin:6px 0 10px;line-height:1.1;text-shadow:0 2px 0 #000}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mu .t{display:flex;flex-direction:column;gap:5px;min-width:0}
.mu .t.r{align-items:flex-end;text-align:right}
.mu .n{font-size:6px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mu .s{font-family:var(--disp);font-size:30px;line-height:1}
.mu .s.lead{color:var(--teal);text-shadow:0 0 12px rgba(46,230,197,.45)}
.mu .vs{font-size:7px;color:var(--ink3)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px;display:flex}
.bar span{display:block;height:100%}
.hero .foot{display:flex;justify-content:space-between;margin-top:9px;font-size:5.5px;color:var(--ink3)}
.live{color:var(--red)}.live::before{content:'● ';animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{padding:12px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;overflow:hidden;transition:transform .12s}
.tile:active,.hero:active{transform:scale(.97)}
.tile .ico{font-size:24px;line-height:1}
.tile h3{margin:0;font-family:var(--disp);font-weight:normal;font-size:14px;line-height:1.15}
.tile p{margin:0;font-size:5.5px;line-height:1.7;color:var(--ink2)}
.timer{display:inline-flex;align-items:center;gap:5px;font-size:5.5px;padding:4px 7px;border-radius:10px;background:rgba(0,0,0,.35);color:var(--ink);align-self:flex-start}
.tile.need{background:linear-gradient(160deg, rgba(255,204,77,.92), rgba(255,140,40,.92));border-color:rgba(255,240,180,.8);color:#2a1300}
.tile.need p,.tile.need .timer{color:#3a1d00}
.tile.need .timer{background:rgba(255,255,255,.35)}
.bang{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:9px;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.3);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.flag{position:absolute;top:0;left:12px;transform:translateY(-50%);font-size:5px;padding:4px 7px;border-radius:8px;background:var(--red);color:#fff;letter-spacing:.06em}

.todo{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:3;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(160deg,#3cf0cf,#12a88f);border:2px solid #e6fff9;box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 18px rgba(46,230,197,.5)}
.todo span{font-size:20px}.todo i{position:absolute;bottom:-12px;font-style:normal;font-size:5.5px;color:var(--ink);text-shadow:0 1px 0 #000}
.todo .bang{top:-4px;right:-4px}

.nav{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:space-around;align-items:center;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(180deg, rgba(12,8,20,.55), rgba(12,8,20,.92));backdrop-filter:blur(10px);border-top:1px solid var(--panel-edge)}
.nav button{position:relative;width:52px;height:46px;border:none;background:none;color:var(--ink3);font-size:20px;cursor:pointer;border-radius:12px;filter:grayscale(.6) brightness(.85)}
.nav button.on{filter:none;background:rgba(255,204,77,.14);box-shadow:inset 0 0 0 1px rgba(255,204,77,.35)}
.nav .dot{top:4px;right:6px}

/* section screen */
.banner{position:relative;margin:-10px -14px 0;height:44%;min-height:220px;display:flex;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 66px) 18px 0}
.banner h1{margin:0;font-family:var(--disp);font-weight:normal;font-size:42px;line-height:1;transform:rotate(-6deg);transform-origin:left bottom;color:#fff;
  text-shadow:0 3px 0 #000,0 0 22px var(--sec,rgba(255,204,77,.6))}
.banner .back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.big .tile{min-height:96px}
.big .tile.wide{grid-column:1/-1;min-height:84px;flex-direction:row;align-items:center;gap:12px;justify-content:flex-start}
.big .tile.wide .ico{font-size:30px}

/* reveal (opens first when there's something new) */
.reveal{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(70% 50% at 50% 45%, rgba(255,190,80,.35), rgba(10,6,18,.92) 70%);backdrop-filter:blur(6px);padding:24px;text-align:center}
.reveal .rib{font-family:var(--disp);font-size:13px;padding:8px 18px;background:linear-gradient(90deg,#ff9a2e,#ffcc4d,#ff9a2e);color:#2a1300;clip-path:polygon(6% 0,94% 0,100% 50%,94% 100%,6% 100%,0 50%)}
.reveal .big-n{font-family:var(--disp);font-size:54px;display:flex;align-items:center;gap:4px;color:var(--gold);text-shadow:0 0 30px rgba(255,204,77,.7),0 4px 0 #000;line-height:1}
.reveal p{font-size:7px;line-height:2;color:var(--ink2);max-width:290px;margin:0}
.reveal canvas{width:120px;animation:hop .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes hop{0%{transform:translateY(40px) scale(.6);opacity:0}}
.btn{font-family:var(--px);font-size:8px;padding:14px 26px;border-radius:14px;border:2px solid #fff3c9;background:linear-gradient(180deg,#ffd45e,#ff9a2e);color:#2a1300;box-shadow:0 5px 0 #8a3d00;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a3d00}

/* pixel dissolve */
canvas#dissolve{position:absolute;inset:0;width:100%;height:100%;z-index:50;pointer-events:none;image-rendering:pixelated}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translateX(-50%);z-index:60;font-size:6.5px;padding:8px 14px;border-radius:14px;background:#39ff6a;color:#04130f;border:2px solid #000;box-shadow:0 3px 0 #000;white-space:nowrap}
.proto{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);z-index:5;font-size:5px;letter-spacing:.1em;color:var(--ink3);background:rgba(0,0,0,.4);padding:3px 8px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="scene" id="scene">
    <canvas class="far px" id="far"></canvas>
    <canvas class="court px" id="court"></canvas>
    <div class="rays"></div>
    <div class="cast" id="cast"></div>
    <canvas class="near px" id="near"></canvas>
    <div class="grade"></div>
    <canvas class="dust" id="dust"></canvas>
    <div class="vignette"></div>
  </div>
  <div id="ui"></div>
  <nav class="nav" id="nav"></nav>
  <canvas id="dissolve" hidden></canvas>
</div>
<script src="../balls.js"></script>
<script>
/* ────────────────────────────────────────────────────────────────────────────
   Sample data (prototype). The real build will read the league.            */
const ME = {name:"Dave", team:"Pixel Pushers", ball:'ball:nova:p9,p3,p1', rec:'2-0'};
const OPP = {name:"Riley", team:"Fast Break Bandits", ch:"bee", rec:"1-1"};
const MU = {me:211, opp:140, live:true};
const PALS = ['hoot','jake','zorp'];

/* ── Scene painting (low-res pixel art, scaled up crisp; the far layer is then
   blurred by CSS for the depth-of-field) ─────────────────────────────────── */
function rng(seed){ let s=seed; return ()=> (s = (s*16807) % 2147483647) / 2147483647; }
function paintFar(cv){
  const W=160,H=110; cv.width=W; cv.height=H; const c=cv.getContext('2d'), r=rng(7);
  const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2a1236'); g.addColorStop(.45,'#5a2440'); g.addColorStop(1,'#1c0f22'); c.fillStyle=g; c.fillRect(0,0,W,H);
  // rafters + lights
  c.fillStyle='#160a1e'; for(let x=0;x<W;x+=20){ c.fillRect(x,0,2,26); } c.fillRect(0,24,W,2);
  for(let x=8;x<W;x+=26){ c.fillStyle='#ffe6a8'; c.fillRect(x,22,4,3); c.fillStyle='rgba(255,220,150,.25)'; c.fillRect(x-3,25,10,4); }
  // jumbotron
  c.fillStyle='#120814'; c.fillRect(66,30,28,14); c.fillStyle='#c46a20'; c.fillRect(68,32,24,10);
  c.fillStyle='#ffd45e'; c.fillRect(70,34,8,6); c.fillRect(82,34,8,6);
  // tiered stands with crowd
  for(let tier=0; tier<5; tier++){
    const y=34+tier*12, h=11; c.fillStyle=['#3a1b3c','#432040','#4d2544','#572a47','#61304b'][tier]; c.fillRect(0,y,W,h);
    for(let x=0;x<W;x+=2){ for(let yy=y+2; yy<y+h-1; yy+=3){ if(r()<.78){ const p=r(); c.fillStyle= p<.25?'#ffcf9e':p<.45?'#8a4b2c':p<.6?'#ff5b5b':p<.72?'#4aa8ff':p<.84?'#ffd45e':'#2a1a2a'; c.fillRect(x,yy,1,2);} } }
    c.fillStyle='rgba(0,0,0,.25)'; c.fillRect(0,y+h-1,W,1);
  }
  // banners
  [[14,'#ff3b4f'],[36,'#4aa8ff'],[118,'#ffcc4d'],[140,'#a46bff']].forEach(([x,col])=>{ c.fillStyle=col; c.fillRect(x,30,8,14); c.fillStyle='rgba(255,255,255,.6)'; c.fillRect(x+2,33,4,2); });
}
function paintCourt(cv){
  const W=200,H=80; cv.width=W; cv.height=H; const c=cv.getContext('2d'), r=rng(3);
  // perspective floor: planks get wider toward the viewer
  for(let y=0;y<H;y++){
    const t=y/H, shade=Math.round(170+60*t), base=[shade, Math.round(shade*.62), Math.round(shade*.32)];
    for(let x=0;x<W;x++){ const plank=Math.floor((x - W/2)/(6+14*t)); const j=(plank*37+y*0)%5; const k=(r()*6)|0;
      c.fillStyle=`rgb(${base[0]-j*6-k},${base[1]-j*4-k},${base[2]-j*3})`; c.fillRect(x,y,1,1); }
  }
  // lines: baseline glow, lane, arc
  c.fillStyle='rgba(255,250,235,.85)'; c.fillRect(0,6,W,1);
  c.fillRect(70,6,1,30); c.fillRect(129,6,1,30); c.fillRect(70,35,60,1);
  c.strokeStyle='rgba(255,250,235,.8)'; c.lineWidth=1; c.beginPath(); c.ellipse(100,36,26,9,0,0,Math.PI); c.stroke();
  // paint
  c.fillStyle='rgba(180,40,60,.35)'; c.fillRect(71,7,58,28);
  // light pool on the floor
  const g=c.createRadialGradient(100,30,4,100,30,90); g.addColorStop(0,'rgba(255,230,170,.35)'); g.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=g; c.fillRect(0,0,W,H);
  c.fillStyle='rgba(0,0,0,.35)'; c.fillRect(0,0,W,3);
}
function paintNear(cv){
  const W=120,H=40; cv.width=W; cv.height=H; const c=cv.getContext('2d'), r=rng(11);
  // front-row heads & a ball, very out of focus
  for(let i=0;i<9;i++){ const x=i*14+(r()*6|0), y=14+(r()*8|0), s=9+(r()*5|0);
    c.fillStyle=['#1a0e16','#2a1620','#120a10'][i%3]; c.beginPath(); c.arc(x,y,s,0,Math.PI*2); c.fill(); c.fillRect(x-s,y,s*2,H); }
  c.fillStyle='#e0702a'; c.beginPath(); c.arc(98,20,7,0,Math.PI*2); c.fill();
  c.fillStyle='rgba(255,210,140,.18)'; c.fillRect(0,0,W,6);
}
// floating dust motes catching the light
function dust(cv){
  const ctx=cv.getContext('2d'); let W,H; const motes=[...Array(38)].map(()=>({x:Math.random(),y:Math.random(),z:.3+Math.random()*.9,v:.02+Math.random()*.05,p:Math.random()*6}));
  const size=()=>{ W=cv.width=cv.clientWidth*devicePixelRatio; H=cv.height=cv.clientHeight*devicePixelRatio; }; size(); addEventListener('resize',size);
  (function f(t){ ctx.clearRect(0,0,W,H);
    for(const m of motes){ m.y-=m.v*.0016; m.x+=Math.sin(t/1800+m.p)*.00025; if(m.y<-.05){m.y=1.05;m.x=Math.random();}
      const a=.25+.35*Math.sin(t/900+m.p); const s=Math.max(1,(m.z*2.4)|0)*devicePixelRatio;
      ctx.fillStyle=`rgba(255,226,160,${Math.max(0,a)*m.z})`; ctx.fillRect((m.x*W)|0,(m.y*H*.85)|0,s,s); }
    requestAnimationFrame(f); })(0);
}
function sprite(tokOrCh, scale=4, opt){
  const cv=document.createElement('canvas'); cv.className='px';
  const r = BB.isBall(tokOrCh) ? BB.parse(tokOrCh) : {ch:tokOrCh, pick:BB.fresh(tokOrCh)};
  BB.draw(cv, r.pick, r.ch, scale, opt); return cv;
}
function setCast(list){
  const el=document.getElementById('cast'); el.innerHTML='';
  list.forEach(({tok,label,me})=>{ const w=document.createElement('div'); w.className='who'+(me?' me':''); w.appendChild(sprite(tok)); if(label){ const t=document.createElement('div'); t.className='tag'; t.textContent=label; w.appendChild(t);} el.appendChild(w); });
}

/* ── Screens ─────────────────────────────────────────────────────────────── */
const NAV = [['home','🏠'],['fantasy','🏀',1],['wlc','🔮',1],['duel','⚡',1],['me','👤']];
let cur='home';
function nav(){ document.getElementById('nav').innerHTML = NAV.map(([k,i,d])=>`<button class="${k===cur?'on':''}" onclick="go('${k}')" aria-label="${k}">${i}${d?'<span class="dot"></span>':''}</button>`).join(''); }
const meChip = () => `<div class="me-chip"><span id="mechip"></span><div><b>${ME.name}</b><i>LV 12 · ${ME.rec}</i></div></div>`;
function home(){
  setCast([{tok:'bee', label:OPP.team.toUpperCase()},{tok:ME.ball, label:'YOU', me:true},{tok:'hoot', label:''}]);
  const total=MU.me+MU.opp;
  return `<div class="screen">
    <div class="top">${meChip()}<div class="sp"></div>
      <button class="ibtn" onclick="say('League News')">📰<span class="dot">3</span></button>
      <button class="ibtn" onclick="say('Chat')">💬<span class="dot"></span></button></div>
    <div class="hero-space"></div>
    <div class="card hero" onclick="go('fantasy')">
      <div class="eyebrow">WEEK 3 · YOUR MATCH-UP</div>
      <div class="mu">
        <div class="t"><span class="n">${ME.team.toUpperCase()}</span><span class="s ${MU.me>MU.opp?'lead':''}">${MU.me}</span></div>
        <span class="vs">VS</span>
        <div class="t r"><span class="n">${OPP.team.toUpperCase()}</span><span class="s ${MU.opp>MU.me?'lead':''}">${MU.opp}</span></div>
      </div>
      <div class="bar"><span style="width:${100*MU.me/total}%;background:linear-gradient(90deg,#12a88f,#2ee6c5)"></span><span style="flex:1;background:linear-gradient(90deg,#ff7a8a,#ff3b4f)"></span></div>
      <div class="foot"><span class="live">LIVE · 4 PLAYERS ON COURT</span><span>TAP FOR BOX SCORE ›</span></div>
    </div>
    <div class="tiles">
      <div class="card tile need" onclick="go('duel')"><span class="bang">!</span><div class="ico">⚡</div><div><h3>Daily<br>Duel</h3><p>Maxey or Booker?<br>Wet Wednesday 💦</p></div><span class="timer">⏱ 2 HR 14 MIN</span></div>

/* ── RPG pixel dissolve: the screen breaks into chunky blocks, then the new one
   resolves out of them ────────────────────────────────────────────────────── */
let busy=false;
function dissolve(swap, color='#0c0814'){
  const cv=document.getElementById('dissolve'), app=document.getElementById('app');
  const B=12, cols=Math.ceil(app.clientWidth/B), rows=Math.ceil(app.clientHeight/B);
  cv.width=cols; cv.height=rows; cv.hidden=false; const c=cv.getContext('2d'); c.fillStyle=color;
  const cells=[...Array(cols*rows).keys()].sort(()=>Math.random()-.5);
  const N=cells.length, T=220;
  return new Promise(done=>{
    const t0=performance.now();
    (function cover(t){ const k=Math.min(N, Math.round(N*(t-t0)/T)); c.clearRect(0,0,cols,rows);
      for(let i=0;i<k;i++){ const v=cells[i]; c.fillRect(v%cols,(v/cols)|0,1,1); }
      if(k<N) requestAnimationFrame(cover); else { swap(); const t1=performance.now();
        (function reveal(t){ const k2=Math.min(N, Math.round(N*(t-t1)/T)); c.clearRect(0,0,cols,rows); c.fillStyle=color;
          for(let i=k2;i<N;i++){ const v=cells[i]; c.fillRect(v%cols,(v/cols)|0,1,1); }
          if(k2<N) requestAnimationFrame(reveal); else { cv.hidden=true; done(); } })(t1); }
    })(t0);
  });
}
async function go(k){ if(busy || k===cur) return; busy=true; await dissolve(()=>{ cur=k; render(); }); busy=false; }
function say(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.getElementById('app').appendChild(d); setTimeout(()=>d.remove(),1600); }

/* ── Reveal first (like opening a pack): yesterday's Duel result ──────────── */

  r.querySelector('.btn').onclick=()=>dissolve(()=>r.remove(), '#ffcc4d');
  document.getElementById('app').appendChild(r);
}
